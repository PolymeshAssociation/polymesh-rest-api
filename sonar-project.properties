sonar.projectKey=PolymeshAssociation_polymesh-rest-api
sonar.organization=polymeshassociation

# The datastore repo specs delegate to a shared, reusable suite that each implementation
# must pass (e.g. `NotificationRepo.test(repo)`). The `it(...)` blocks live in the
# `*.repo.suite.ts` helpers, so Sonar's static analysis cannot see them and wrongly reports
# S2187 ("Add some tests to this file or delete it"). These files do run real tests.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.e1.resourceKey=src/datastore/**/repos/*.repo.spec.ts

# The webhook URL guard lists the loopback, private, link-local and other internal ranges that webhooks
# must never reach. Those IP literals are the blocklist itself, not hardcoded endpoints, so S1313
# ("IP addresses should not be hardcoded") does not apply to this file.
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1313
sonar.issue.ignore.multicriteria.e2.resourceKey=src/common/utils/webhook-url.ts
